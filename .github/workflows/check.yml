name: Check briefs

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python scripts/lint_briefs.py
      - run: python -m pip install -r requirements-docs.txt
      - run: zensical build --clean --strict
