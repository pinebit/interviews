[project]
site_name = "Interview Refresher"
site_description = "Topic briefs on what engineers forget before technical interviews."
site_url = "https://pinebit.github.io/interviews/"
docs_dir = "docs"
site_dir = "site"
nav = [
  { "Home" = "index.md" },
  { "Fundamentals" = [
    { "Algorithms" = "topics/algorithms.md" },
    { "Databases" = "topics/database.md" },
    { "Distributed Systems" = "topics/distributed.md" },
    { "Networking" = "topics/networking.md" },
    { "Operating Systems" = "topics/os.md" },
    { "System Design" = "topics/system.md" },
  ] },
  { "Languages" = [
    { "Go" = "topics/golang.md" },
    { "JavaScript" = "topics/javascript.md" },
    { "Python" = "topics/python.md" },
    { "Rust" = "topics/rust.md" },
    { "Solidity" = "topics/solidity.md" },
    { "TypeScript" = "topics/typescript.md" },
  ] },
  { "Web" = [
    { "Backend" = "topics/backend.md" },
    { "Frontend" = "topics/frontend.md" },
    { "Next.js" = "topics/nextjs.md" },
    { "React" = "topics/react.md" },
    { "Security" = "topics/security.md" },
  ] },
  { "Infrastructure" = [
    { "AWS" = "topics/aws.md" },
    { "DevOps" = "topics/devops.md" },
  ] },
  { "Domains" = [
    { "AI Engineering" = "topics/ai.md" },
    { "Ethereum" = "topics/ethereum.md" },
  ] },
]

[project.theme]
features = ["navigation.sections", "toc.follow"]

[project.validation]
invalid_links = true
invalid_link_anchors = true

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/pinebit/interviews"
name = "Source on GitHub"

[[project.extra.social]]
icon = "fontawesome/brands/linkedin"
link = "https://www.linkedin.com/in/pinebit/"
name = "Andrei Smirnov on LinkedIn"

